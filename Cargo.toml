[package]
name = "epoch-journal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Event sourcing with deciders and pluggable event repositories"
license = "Apache-2.0"
repository = "https://github.com/Shearerbeard/Epoch"
readme = "README.md"
keywords = ["event-sourcing", "cqrs", "event-store", "decider"]
categories = ["database-implementations", "asynchronous"]
exclude = ["/.claude/", "/.github/", "/AGENTS.md", "/CLAUDE.md", "/TODO.md", "/deny.toml", "/docs/internal/", "/docs/design/", "/docs/research/", "/docs/README.md"]

[lib]
name = "epoch"

[features]
default = ["in_memory", "esdb", "redis"]
in_memory = []
esdb = ["dep:eventstore", "dep:uuid", "dep:serde_json"]
redis = ["dep:redis-om"]
postgres = ["dep:tokio-postgres", "dep:bb8", "dep:bb8-postgres", "dep:serde_json"]

[dependencies]
async-trait = "0.1.53"
eventstore = { version = "4.0.0", optional = true }
redis-om = { version = "0.1.0", features = ["json"], optional = true}
rusty_ulid = "2.0.0"
serde = { version = "1.0.136", features = ["derive"] }
serde_json = { version = "1.0.81", optional = true }
thiserror = "1.0"
uuid =  { package = "uuid", version = "1.2.2", features = ["v4", "serde"], optional = true }
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }
bb8 = { version = "0.8", optional = true }
bb8-postgres = { version = "0.8", optional = true }

[dev-dependencies]
actix-rt = "2.7.0"
assert_matches = "1.5.0"
const-random = "0.1.15"
autoincrement = "1"
dotenvy = "0.15"
futures = "0.3.25"
tokio = { version = "1", features = ["time"] }
