services:
  redis:
    image: "redislabs/rejson:latest"
    restart: always
    ports:
      - '6379:6379' 
    command: redis-server --save 120 1 --appendonly yes --loglevel warning --loadmodule /usr/lib/redis/modules/rejson.so
    volumes:
      - redis:/data
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=epoch
      - POSTGRES_PASSWORD=epoch
      - POSTGRES_DB=epoch
    # Published on 54321 rather than 5432 so a system postgres, or
    # another project's container, does not collide with it, and bound
    # to the loopback address because the credentials are throwaway and
    # this database is only ever a test fixture. No restart policy for
    # the same reason: it comes up with `docker compose up` and should
    # not survive a reboot on its own.
    ports:
      - '127.0.0.1:54321:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
  eventstore.db:
    image: eventstore/eventstore:20.10.2-buster-slim
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_EXT_TCP_PORT=1113
      - EVENTSTORE_HTTP_PORT=2113
      - EVENTSTORE_INSECURE=true
      - EVENTSTORE_ENABLE_EXTERNAL_TCP=true
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
    ports:
      - "1113:1113"
      - "2113:2113"
    volumes:
      - type: volume
        source: eventstore-volume-data
        target: /var/lib/eventstore
      - type: volume
        source: eventstore-volume-logs
        target: /var/log/eventstore 

volumes:
  redis:
    driver: local
  postgres:
    driver: local
  eventstore-volume-data:
    driver: local
  eventstore-volume-logs:
    driver: local
